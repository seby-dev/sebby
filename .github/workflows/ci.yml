name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      mypy-target:
        type: string
        default: "src"
      sync-args:
        type: string
        default: "--extra dev"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install Python
        env:
          PYTHON_VERSION: ${{ inputs.python-version || '3.11' }}
        run: uv python install "$PYTHON_VERSION"
      - name: Sync dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args || '--extra dev' }}
        run: uv sync $SYNC_ARGS
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type check
        env:
          MYPY_TARGET: ${{ inputs.mypy-target || 'src' }}
        run: uv run mypy "$MYPY_TARGET"
      - run: uv run pytest
