[project]
name = "revgate"
version = "0.1.0"
description = "Deterministic task and wave reviewer, and gate-if-changed, for sebby's projects"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
revgate = "revgate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bench/prototypes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
