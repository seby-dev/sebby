[project]
name = "sebby"
version = "0.1.0"
description = "Shared Python utilities across sebby's projects: multi-provider LLM client with prompt caching, retry helpers, and more."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = [
    "litellm>=1.50.0",
]
judgement = [
    "typesafe-sdk>=0.6.0",
]
config = [
    "pydantic-settings>=2.0.0",
]
logging = [
    "structlog>=24.0.0",
]
http = [
    "fastapi>=0.115.0",
]
dev = [
    "sebby[llm]",
    "sebby[judgement]",
    "sebby[config]",
    "sebby[logging]",
    "sebby[http]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sebby"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
